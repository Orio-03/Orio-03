<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hey there, I'm Ayman. Data Analyst and MSc Data Science and AI student.">
<style>
.bar{fill:url(#wave);transform-box:fill-box;transform-origin:50% 50%;animation:talk 1s ease-in-out infinite alternate}
@keyframes talk{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.line{stroke-dasharray:579;stroke-dashoffset:579;animation:draw 2.4s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dot{opacity:0;animation:show .3s 2.8s forwards}
.ring{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:ping 2s 3s ease-out infinite}
@keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.rec{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.tie{transform-box:fill-box;transform-origin:50% 50%;animation:wiggle 6s ease-in-out 1.5s infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-10deg)}93%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
.fade{opacity:0;animation:show .8s ease-out forwards}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}.dot,.fade{opacity:1}}
</style>
<defs>
<clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#181b24"/></linearGradient>
<pattern id="foam" width="44" height="44" patternUnits="userSpaceOnUse">
  <path d="M0 0H44L22 22Z" fill="#262a35"/><path d="M44 0V44L22 22Z" fill="#1d212b"/>
  <path d="M0 44H44L22 22Z" fill="#14171e"/><path d="M0 0V44L22 22Z" fill="#1a1d26"/>
</pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#fff" stop-opacity=".9"/></linearGradient>
<mask id="right"><rect width="1200" height="340" fill="url(#fade)"/></mask>
<linearGradient id="wave" x1="0" y1="86" x2="0" y2="266" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8FA8FF"/><stop offset=".5" stop-color="#2F5BFF"/><stop offset="1" stop-color="#8FA8FF"/></linearGradient>
<radialGradient id="spot" cx=".75" cy=".45" r=".5"><stop offset="0" stop-color="#2F5BFF" stop-opacity=".22"/><stop offset="1" stop-color="#2F5BFF" stop-opacity="0"/></radialGradient>
</defs>
